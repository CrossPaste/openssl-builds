# Fork patch (CrossPaste): windows-only rerun of build.yaml.
#
# Upstream's windows job fails on current windows-latest images (Windows Server
# 2025 + Visual Studio 2026 only): conan's VCVars resolves msvc compiler.version
# 194 to a "Visual Studio 17" installation which no longer exists on the image.
# The image does ship the VC 14.44 (=194) toolset inside VS 18, so the only
# change vs upstream is adding `-c "tools.microsoft.msbuild:vs_version=18"` to
# the msvc (windows-x64) step. All other steps are verbatim from build.yaml.
name: 'Build Windows'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version of OpenSSL 3'
        type: 'string'
        required: true
defaults:
  run:
    shell: 'bash'
jobs:
  windows:
    name: 'windows-${{ inputs.version }}'
    runs-on: 'windows-latest'
    steps:
    - id: 'step-0'
      uses: 'actions/setup-python@v5'
      with:
        python-version: '3.x'
    - id: 'step-1'
      run: 'pip install conan'
    - id: 'step-2'
      uses: 'actions/checkout@v4'
      with:
        submodules: 'true'
    - id: 'step-3'
      run: 'conan profile detect'
    - id: 'step-4'
      run: 'conan install packages/openssl3 --output-folder build/openssl3/mingw-x64 --build=missing --version=${{ inputs.version }} -pr:b default -pr:h profiles/mingw-x64 -o "*:shared=True" -o "openssl/*:no_apps=True" -o "openssl/*:no_zlib=True"'
    - id: 'step-5'
      run: 'conan install packages/openssl3 --output-folder build/openssl3/mingw-x64 --build=missing --version=${{ inputs.version }} -pr:b default -pr:h profiles/mingw-x64 -o "*:shared=False" -o "openssl/*:no_apps=True" -o "openssl/*:no_zlib=True"'
    - id: 'step-6'
      run: 'conan install packages/openssl3 --output-folder build/openssl3/windows-x64 --build=missing --version=${{ inputs.version }} -pr:b default -pr:h profiles/windows-x64 -c "tools.microsoft.msbuild:vs_version=18" -o "*:shared=True" -o "openssl/*:no_apps=True" -o "openssl/*:no_zlib=True"'
    - id: 'step-7'
      run: 'tar -rvf windows.tar build/openssl3/*/lib'
    - id: 'step-8'
      run: 'tar -rvf windows.tar build/openssl3/*/include'
    - id: 'step-9'
      run: 'tar -rvf windows.tar build/openssl3/*/bin'
    - id: 'step-10'
      uses: 'actions/upload-artifact@v4'
      with:
        name: 'openssl-windows-${{ inputs.version }}'
        path: 'windows.tar'
        if-no-files-found: 'error'
